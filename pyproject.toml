[project]
name = "gto-mcp"
version = "0.1.0"
description = "Read-only offline GregTech Odyssey recipe query MCP (runtime dump or static index)"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
gto-mcp = "gto_mcp.server:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
